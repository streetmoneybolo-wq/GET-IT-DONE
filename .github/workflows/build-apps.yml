name: Build the StockMarketLoop apps

# Run by hand: Actions > Build the StockMarketLoop apps > Run workflow.
# Publishes the files to the rolling release "app-latest", which the download page at
# https://sml-platform-api.onrender.com/app/get links to (set SML_APP_ANDROID_URL etc. on Render, see apps/README.md).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the Android app
        working-directory: apps/mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # launcher icon from the app artwork
          for d in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            dir=android/app/src/main/res/${d%%:*}; size=${d##*:}
            if command -v convert >/dev/null; then for f in ic_launcher ic_launcher_round ic_launcher_foreground; do convert icon.png -resize ${size}x${size} $dir/$f.png || true; done; fi
          done
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Collect
        run: mkdir -p out && cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk out/StockMarketLoop.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/StockMarketLoop.apk }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build the desktop app
        working-directory: apps/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - name: Publish the rolling release
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          ls -la files
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "StockMarketLoop apps" --notes "Android and desktop builds. Install page: https://sml-platform-api.onrender.com/app/get" --latest=false
          gh release upload app-latest files/* --clobber
