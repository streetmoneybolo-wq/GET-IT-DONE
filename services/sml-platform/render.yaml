services:
  - type: web
    name: sml-platform-api
    runtime: node
    rootDir: services/sml-platform
    region: ohio
    plan: starter
    buildCommand: npm ci
    # The initial dry-run was reviewed against the new, empty platform
    # database.  This explicit release applies only the versioned additive
    # migrations; the runner records each one so future deploys are no-ops.
    preDeployCommand: npm run db:release
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: SML_MIGRATION_MODE
        value: apply
      - key: DATABASE_URL
        fromDatabase:
          name: sml-platform-db
          property: connectionString
      - key: SML_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SML_BILLING_API_SECRET
        sync: false
      - key: UPGRADE_CHAT_CLIENT_ID
        sync: false
      - key: UPGRADE_CHAT_CLIENT_SECRET
        sync: false
      - key: UPGRADE_CHAT_PLAN_MAP_JSON
        sync: false

  - type: worker
    name: sml-platform-worker
    runtime: node
    rootDir: services/sml-platform
    region: ohio
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: sml-platform-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SML_WORDPRESS_BILLING_BRIDGE_URL
        sync: false
      - key: SML_WORDPRESS_BILLING_BRIDGE_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
