services:
  - type: web
    name: sml-platform-api
    runtime: node
    rootDir: services/sml-platform
    region: ohio
    plan: starter
    buildCommand: npm ci
    # The initial dry-run was reviewed against the new, empty platform
    # database.  This explicit release applies only the versioned additive
    # migrations; the runner records each one so future deploys are no-ops.
    preDeployCommand: npm run db:release
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: SML_MIGRATION_MODE
        value: apply
      - key: DATABASE_URL
        fromDatabase:
          name: sml-platform-db
          property: connectionString
      - key: SML_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SML_BILLING_API_SECRET
        sync: false
      - key: UPGRADE_CHAT_CLIENT_ID
        sync: false
      - key: UPGRADE_CHAT_CLIENT_SECRET
        sync: false
      - key: UPGRADE_CHAT_PLAN_MAP_JSON
        sync: false
      - key: SML_NEWS_INGEST_TOKEN
        sync: false
      - key: SML_ALERT_ROUTER_SECRET
        sync: false
      # --- private owner-only member email analytics; no plaintext email enters browser analytics ---
      - key: SML_MEMBER_EMAIL_ENABLED
        sync: false
      - key: SML_EMAIL_ENCRYPTION_KEY
        sync: false
      - key: SML_EMAIL_HASH_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SML_EMAIL_FROM
        sync: false
      - key: SML_EMAIL_REPLY_TO
        sync: false
      - key: SML_EMAIL_BUSINESS_ADDRESS
        sync: false
      # --- dispute-evidence system (all disabled until set; values live only in Render) ---
      # --- corporate accounts (disabled until all three are set; also needs SML_EVIDENCE_ENCRYPTION_KEY) ---
      - key: SML_CORPORATE_ENABLED
        sync: false
      - key: SML_CORPORATE_VERIFICATION_SECRET
        sync: false
      - key: SML_DISPUTE_EVIDENCE_ENABLED
        sync: false
      - key: SML_EVIDENCE_ENCRYPTION_KEY
        sync: false
      - key: SML_PAYPAL_ENABLED
        sync: false
      - key: SML_PAYPAL_ENV
        sync: false
      - key: SML_PAYPAL_CLIENT_ID
        sync: false
      - key: SML_PAYPAL_CLIENT_SECRET
        sync: false
      - key: SML_PAYPAL_WEBHOOK_ID
        sync: false
      - key: SML_CONNECT_BOT_ENABLED
        sync: false
      - key: SML_DISCORD_CONNECT_PUBLIC_KEY
        sync: false
      - key: SML_DISCORD_CONNECT_APP_ID
        sync: false
      - key: SML_DISCORD_CONNECT_CLIENT_SECRET
        sync: false
      - key: SML_LOOP_KICK_BRIDGE_SECRET
        sync: false
      - key: SML_LOOP_KICK_BRIDGE_URL
        value: "https://stockmarketloop.com"
      - key: SML_LOOP_KICK_APP_URL
        value: "https://stockmarketloop-loop-kick.onrender.com"
      - key: SML_DISPUTE_BOT_ENABLED
        sync: false
      - key: SML_DISPUTE_BOT_PUBLIC_KEY
        sync: false
      - key: SML_DISPUTE_BOT_APP_ID
        sync: false
      - key: SML_ACADEMY_APP_ID
        value: "1551336038713139370"
      - key: SML_ACADEMY_CLIENT_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      # Public Massive redistribution is OFF unless the owner confirms a
      # Business license. The private Academy may continue using the feed.
      - key: MASSIVE_PUBLIC_CHARTS_ENABLED
        # Temporary owner-requested live-site test. Set back to "0" before
        # using the relay as a public production data source.
        value: "1"
      # Keep Massive options disabled until an entitled Options plan exists.
      - key: MASSIVE_OPTIONS_ENABLED
        value: "0"
      - key: SML_ACADEMY_ELEVENLABS_VOICE_ID
        sync: false
      - key: SML_ACADEMY_ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      - key: SML_ACADEMY_GUILD_ID
        sync: false
      - key: SML_ACADEMY_MANAGER_ROLE_ID
        sync: false
      - key: SML_ACADEMY_MONARCH_ROLE_ID
        value: "1260433215189946420"
      # --- MEM Academy gate, free tier and content gate: all off while unset.
      # Values and stages: services/sml-platform/platform/academy/billing/LAUNCH.md
      - key: SML_ACADEMY_ACCESS_ROLE_IDS
        sync: false
      - key: SML_ACADEMY_MEMBER_ROLE_IDS
        sync: false
      # --- Click-to-Alert: the separate paid add-on. Off until the role its subscription grants is named here (comma-separated Discord role ids).
      - key: SML_ACADEMY_CLICK_ALERT_ROLE_IDS
        sync: false
      - key: SML_ACADEMY_MONARCH_ACCESS
        sync: false
      - key: SML_ACADEMY_BILLING_LIFETIME_ROLE_ID
        sync: false
      - key: SML_ACADEMY_FREE_SESSIONS
        sync: false
      - key: SML_ACADEMY_CONTENT_GATE_ENABLED
        sync: false
      - key: SML_ACADEMY_FREE_PREVIEW
        sync: false
      - key: SML_ACADEMY_FREE_SYMBOLS
        sync: false
      - key: SML_ACADEMY_ALERTS_TIERING
        sync: false
      - key: SML_ACADEMY_BILLING_IN_DISCORD_LINKS
        sync: false
      - key: SML_ACADEMY_BILLING_PUBLIC_URL
        sync: false
      # Platform lifecycle: drop row-scoped intents for subscriptions with no row (set "1" before Academy checkout).
      - key: SML_LIFECYCLE_SKIP_ROWLESS
        sync: false
      - key: SML_DISPUTE_BOT_TOKEN
        sync: false
      - key: SML_CONNECT_REVIEW_URL_SECRET
        sync: false
      - key: SML_UC_WEBHOOK_PATH_TOKEN
        sync: false

  # Separate Discord application and process. It shares only the platform
  # database with Connect; it has its own token, signing key and deploy cycle.
  - type: web
    name: making-easy-money-academy
    runtime: node
    rootDir: services/sml-platform
    region: ohio
    plan: starter
    buildCommand: npm ci
    startCommand: npm run academy
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: sml-platform-db
          property: connectionString
      - key: SML_ACADEMY_ENABLED
        value: "1"
      - key: SML_ACADEMY_PUBLIC_KEY
        sync: false
      - key: SML_ACADEMY_APP_ID
        value: "1551336038713139370"
      - key: SML_ACADEMY_CLIENT_SECRET
        sync: false
      - key: SML_ACADEMY_BOT_TOKEN
        sync: false
      - key: SML_ACADEMY_GUILD_ID
        sync: false
      - key: SML_ACADEMY_CATEGORY_ID
        sync: false
      - key: SML_ACADEMY_MANAGER_ROLE_ID
        sync: false
      - key: SML_ACADEMY_MONARCH_ROLE_ID
        sync: false
      # --- MEM Academy billing engine + hub gate: every switch off while unset.
      # Values and stages: services/sml-platform/platform/academy/billing/LAUNCH.md
      - key: SML_ACADEMY_BILLING_ENABLED
        sync: false
      - key: SML_ACADEMY_BILLING_CHECKOUT_ENABLED
        sync: false
      - key: SML_ACADEMY_BILLING_ROLE_MODE
        sync: false
      - key: SML_ACADEMY_BILLING_REVOKES_ENABLED
        sync: false
      - key: SML_ACADEMY_BILLING_RECONCILE_MODE
        sync: false
      - key: SML_ACADEMY_BILLING_RECONCILE_INTERVAL_MS
        sync: false
      - key: SML_ACADEMY_BILLING_RECONCILE_SCAN
        sync: false
      - key: SML_ACADEMY_BILLING_MAX_REVOKES_PER_RUN
        sync: false
      - key: SML_ACADEMY_BILLING_PROXY_HOPS
        sync: false
      - key: SML_ACADEMY_BILLING_WEBHOOK_SECRET
        sync: false
      - key: SML_ACADEMY_BILLING_STRIPE_KEY
        sync: false
      - key: SML_ACADEMY_BILLING_STRIPE_ACCOUNT_ID
        sync: false
      - key: SML_ACADEMY_BILLING_LIVEMODE
        sync: false
      - key: SML_ACADEMY_BILLING_PRICES_JSON
        sync: false
      - key: SML_ACADEMY_BILLING_ACADEMY_ROLE_ID
        sync: false
      - key: SML_ACADEMY_BILLING_LIFETIME_ROLE_ID
        sync: false
      - key: SML_ACADEMY_BILLING_PROTECTED_ROLE_IDS
        sync: false
      # External roles a price may grant (default Monarch, Elite, Premium) and
      # the Upgrade.Chat check that must pass before the engine removes one.
      # UC_MATCH: unset = any (any active Upgrade.Chat upgrade keeps the role;
      # no product map needed) | mapped (only UC_ROLE_PRODUCTS_JSON products).
      - key: SML_ACADEMY_BILLING_EXTERNAL_ROLE_IDS
        sync: false
      - key: SML_ACADEMY_BILLING_UC_MATCH
        sync: false
      - key: SML_ACADEMY_BILLING_UC_ROLE_PRODUCTS_JSON
        sync: false
      - key: UPGRADE_CHAT_CLIENT_ID
        sync: false
      - key: UPGRADE_CHAT_CLIENT_SECRET
        sync: false
      - key: SML_ACADEMY_BILLING_GUILD_ID
        sync: false
      - key: SML_ACADEMY_BILLING_PORTAL_CONFIG_ID
        sync: false
      - key: SML_ACADEMY_BILLING_PUBLIC_URL
        sync: false
      - key: SML_ACADEMY_BILLING_INVITE_URL
        sync: false
      - key: SML_ACADEMY_BILLING_TERMS_URL
        sync: false
      - key: SML_ACADEMY_BILLING_PRIVACY_URL
        sync: false
      - key: SML_ACADEMY_BILLING_CONSENT_VERSION
        sync: false
      - key: SML_ACADEMY_BILLING_PAYMENT_METHODS
        sync: false
      - key: SML_ACADEMY_BILLING_TOS_CONSENT
        sync: false
      - key: SML_ACADEMY_BILLING_AUTOMATIC_TAX
        sync: false
      - key: SML_ACADEMY_BILLING_ALLOW_NON_MEMBER
        sync: false
      - key: SML_ACADEMY_BILLING_AUTO_JOIN
        sync: false
      - key: SML_ACADEMY_BILLING_PARTIAL_REFUND_REVOKES
        sync: false
      - key: SML_ACADEMY_BILLING_CANCEL_ON_REFUND
        sync: false
      - key: SML_ACADEMY_BILLING_IN_DISCORD_LINKS
        sync: false
      - key: SML_ACADEMY_BILLING_SEEN_NOTIFY
        sync: false
      - key: SML_ACADEMY_BILLING_TEST_CLOCK
        sync: false
      - key: SML_ACADEMY_ACCESS_ROLE_IDS
        sync: false
      - key: SML_ACADEMY_MEMBER_ROLE_IDS
        sync: false
      - key: SML_ACADEMY_MONARCH_ACCESS
        sync: false
      - key: SML_ACADEMY_HUB_ROLE_GATE
        sync: false
      - key: SML_ACADEMY_FREE_PREVIEW
        sync: false

  - type: worker
    name: sml-platform-worker
    runtime: node
    rootDir: services/sml-platform
    region: ohio
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: sml-platform-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SML_WORDPRESS_BILLING_BRIDGE_URL
        sync: false
      - key: SML_WORDPRESS_BILLING_BRIDGE_SECRET
        sync: false
      # Outbox dead-letter cap for rows that can never succeed; unset = retry forever (set "20" before Academy checkout).
      - key: SML_BILLING_OUTBOX_MAX_ATTEMPTS
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SML_ALERT_ROUTER_SECRET
        sync: false
      # Must match the API service so the worker can decrypt and deliver queued messages.
      - key: SML_MEMBER_EMAIL_ENABLED
        sync: false
      - key: SML_EMAIL_ENCRYPTION_KEY
        sync: false
      - key: SML_EMAIL_HASH_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SML_EMAIL_FROM
        sync: false
      - key: SML_EMAIL_REPLY_TO
        sync: false
      - key: SML_EMAIL_BUSINESS_ADDRESS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SML_NEWS_OPENAI_MODEL
        value: gpt-5-mini
      - key: SML_WORDPRESS_URL
        value: https://stockmarketloop.com
      - key: SML_WORDPRESS_USERNAME
        sync: false
      - key: SML_WORDPRESS_APP_PASSWORD
        sync: false
      - key: SML_WORDPRESS_AUTHOR_SLUG
        value: stockmarketloop
      - key: SML_WORDPRESS_AUTHOR_NAME
        value: SML NEWS
      # --- dispute-evidence system (worker: sweeps, alerts, disputed-access policy) ---
      # --- corporate accounts (disabled until all three are set; also needs SML_EVIDENCE_ENCRYPTION_KEY) ---
      - key: SML_CORPORATE_ENABLED
        sync: false
      - key: SML_CORPORATE_VERIFICATION_SECRET
        sync: false
      - key: SML_DISPUTE_EVIDENCE_ENABLED
        sync: false
      - key: SML_EVIDENCE_ENCRYPTION_KEY
        sync: false
      - key: SML_PAYPAL_ENABLED
        sync: false
      - key: SML_PAYPAL_ENV
        sync: false
      - key: SML_PAYPAL_CLIENT_ID
        sync: false
      - key: SML_PAYPAL_CLIENT_SECRET
        sync: false
      - key: SML_CONNECT_BOT_ENABLED
        sync: false
      - key: SML_DISCORD_CONNECT_BOT_TOKEN
        sync: false
      # --- bounded Claude/Codex orchestrator; disabled until explicitly set to 1 ---
      - key: SML_AI_ORCHESTRATOR_ENABLED
        value: "0"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SML_ACADEMY_CLAUDE_MODEL
        value: claude-sonnet-5
      - key: SML_AI_OPENAI_MODEL
        value: gpt-5.4-mini
      - key: SML_AI_ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: SML_AI_MAX_OUTPUT_TOKENS
        value: "3000"
      - key: SML_AI_MAX_TASKS_PER_TICK
        value: "1"
      - key: SML_AI_VERIFY_HOSTS
        value: sml-platform-api.onrender.com,stockmarketloop.com
      - key: SML_AI_OPENAI_INPUT_USD_PER_MILLION
        sync: false
      - key: SML_AI_OPENAI_OUTPUT_USD_PER_MILLION
        sync: false
      - key: SML_AI_ANTHROPIC_INPUT_USD_PER_MILLION
        sync: false
      - key: SML_AI_ANTHROPIC_OUTPUT_USD_PER_MILLION
        sync: false
      - key: UPGRADE_CHAT_CLIENT_ID
        sync: false
      - key: UPGRADE_CHAT_CLIENT_SECRET
        sync: false

  # Neutral-brand social task and payout bot. Its public name and copy must not
  # use StockMarketLoop or Making Easy Money branding.
  - type: worker
    name: daily-social-payouts
    runtime: node
    rootDir: services/daily-social-payouts
    region: ohio
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:daily-social
    autoDeployTrigger: commit
    disk:
      name: daily-social-payouts-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_RUNTIME_MODE
        value: daily-social
      - key: DATA_DIR
        value: /var/data
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: BASE_SHARE_LINK
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  # Staging copy of the rebuilt social payouts bot (services/social-payouts). Its own Discord application,
  # its own data disk, and every payout lock left closed: it can only ever preview. Delete it after cutover.
  - type: worker
    name: social-payouts-staging
    runtime: node
    rootDir: services/social-payouts
    region: ohio
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    disk:
      name: social-payouts-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PAYPAL_PAYOUT_DRY_RUN
        value: "1"
      - key: PAYOUT_AUTO_DAILY
        value: "0"
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: PAYOUT_DETAILS_KEY
        sync: false

  # Read-only alert watcher and article pipeline; isolated from the social bot.
  - type: worker
    name: retail-trader-spotlight-monitor
    runtime: node
    rootDir: services/daily-social-payouts
    region: ohio
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start:spotlight
    autoDeployTrigger: commit
    disk:
      name: retail-trader-spotlight-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SPOTLIGHT_DISCORD_TOKEN
        sync: false
      # Telegram bridge credentials; the token is set only in Render, never in Git.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Optional: defaults to telegramNewsForward.chatId in settings.json when unset.
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ARTICLE_MODEL
        value: gpt-5-mini
      - key: WP_BASE_URL
        value: https://stockmarketloop.com
      - key: WP_USERNAME
        sync: false
      - key: WP_APP_PASSWORD
        sync: false
      - key: ARTICLE_POLL_SECONDS
        value: "120"
