<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get the StockMarketLoop app</title>
<meta name="description" content="Install StockMarketLoop on iPhone, Android, Windows, Mac or Linux: live scanner, charts, news and alerts.">
<meta name="theme-color" content="#06110d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="stylesheet" href="/app/get.css">
</head>
<body>
<main>
  <img class="logo" src="/app/icon-192.png" width="84" height="84" alt="">
  <h1>Get the StockMarketLoop app</h1>
  <p class="sub">Live scanner, watchlist, charts, news and alerts. One tap on most phones and computers, no store needed.</p>
  <section id="status" class="card" aria-live="polite"><p>Checking your device…</p></section>
  <section id="native" class="card" hidden><h2>Downloads</h2><div id="native-list"></div></section>
  <section class="card"><h2>Other devices</h2>
    <div class="grid" id="others"></div>
    <button id="share" class="btn ghost" type="button" hidden>Send this link to my phone</button>
    <button id="copy" class="btn ghost" type="button">Copy link</button>
  </section>
  <p class="foot">Already a member? Sign in inside the app with your stockmarketloop.com username and password. <a href="/app/">Open the web app</a></p>
</main>
<noscript><p style="padding:20px;color:#dfe9ee;font:16px system-ui">Open <a href="/app/" style="color:#7dffc4">stockmarketloop.com/app</a> in your browser and use Add to Home Screen.</p></noscript>
<script src="/app/get.js" defer></script>
</body>
</html>
