<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Channel — local shell test</title>
<link rel="stylesheet" href="/css/loop-channel.css">
<style>body{margin:0;background:#04060a}</style>
</head>
<body>
<div id="sml-ch-root" aria-label="Loop Channel"></div>
<script>
/* local-only mock: fakes a /channel/{handle}/ path + canned API responses so
   the shell can be visually QA'd without a live WordPress session. Never
   shipped — this file only loads the mock when ?mock=1 is present. */
if (location.search.indexOf('mock=1') !== -1) {
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    if (/sml-live\/v1\/feeds/.test(url)) return Promise.resolve(new Response(JSON.stringify({ live: new URLSearchParams(location.search).get('live') !== '0', creator: { name: 'Ray Dolo', handle: 'raydolo' } })));
    if (/sml-lw\/v1\/presence/.test(url)) return Promise.resolve(new Response(JSON.stringify({ count: 412 })));
    if (/sml-lb\/v1\/card/.test(url)) return Promise.resolve(new Response(JSON.stringify({ profile: { photo: '' } })));
    if (/sml-members\/v1\/follow/.test(url)) return Promise.resolve(new Response(JSON.stringify({ followers: 48213, following: false })));
    if (/sml-channel\/v1\/channel/.test(url)) return Promise.resolve(new Response(JSON.stringify({
      creator: { id: 77, name: 'Ray Dolo', handle: 'raydolo' }, stats: { videos: 6, views: 148230, posts: 4 },
      videos: [
        { id:'a1', title:'Opening Bell: Momentum Map', watch_url:'#video-1', thumbnail:'https://picsum.photos/seed/loop1/720/405', views_label:'58,210 views', views:58210, duration:'12:48', created_at:'2026-08-16T12:00:00Z' },
        { id:'a2', title:'How I Read the Tape', watch_url:'#video-2', thumbnail:'https://picsum.photos/seed/loop2/720/405', views_label:'34,800 views', views:34800, duration:'08:21', created_at:'2026-08-15T14:00:00Z' },
        { id:'a3', title:'Three Levels Into the Close', watch_url:'#video-3', thumbnail:'https://picsum.photos/seed/loop3/720/405', views_label:'22,110 views', views:22110, duration:'17:06', created_at:'2026-08-14T14:00:00Z' },
        { id:'a4', title:'Options Flow Breakdown', watch_url:'#video-4', thumbnail:'https://picsum.photos/seed/loop4/720/405', views_label:'15,200 views', views:15200, duration:'09:42', created_at:'2026-08-13T14:00:00Z' },
        { id:'a5', title:'Premarket Watchlist', watch_url:'#video-5', thumbnail:'https://picsum.photos/seed/loop5/720/405', views_label:'10,320 views', views:10320, duration:'06:11', created_at:'2026-08-12T14:00:00Z' },
        { id:'a6', title:'Risk First, Entry Second', watch_url:'#video-6', thumbnail:'https://picsum.photos/seed/loop6/720/405', views_label:'7,590 views', views:7590, duration:'14:03', created_at:'2026-08-11T14:00:00Z' }
      ],
      posts: [
        { id:'p1', kind:'chart_post', body:'Watching the VWAP reclaim into the afternoon session.', date:'2026-08-16T15:00:00Z', tickers:['SPY','QQQ'], metrics:{likes:84} },
        { id:'p2', kind:'post', title:'Today’s trading plan', body:'Patience first. Let price confirm before sizing the trade.', date:'2026-08-16T13:30:00Z', tickers:['NVDA'], metrics:{likes:51} },
        { id:'p3', kind:'stream_post', body:'Live after the opening range. Bring your charts.', date:'2026-08-15T18:00:00Z', tickers:['IWM'], metrics:{likes:33} },
        { id:'p4', kind:'sml_news', title:'What changed after CPI', body:'A fast review of rates, breadth and the index reaction.', date:'2026-08-14T17:00:00Z', tickers:['SPY'], metrics:{likes:27} }
      ]
    })));
    if (/sml-loopletters\/v1\/issues/.test(url)) return Promise.resolve(new Response(JSON.stringify({ issues: [
      { title: 'CPI week playbook', date: '2026-08-01', topic: 'Macro' },
      { title: 'Gamma squeeze anatomy', date: '2026-07-24', topic: '0DTE' },
      { title: 'Reading the tape, not the news', date: '2026-07-17', topic: 'Levels' }
    ] })));
    return origFetch ? origFetch(url, opts) : Promise.reject(new Error('no fetch'));
  };
}
</script>
<script src="/js/loop-channel.js"></script>
</body>
</html>
